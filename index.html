<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prosperr Advisor Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Prosperr product blue — taken from the live console */
  --navy:#1266dc; --navy-deep:#0d4fb0; --tint:#eef5fe; --tint-2:#dce9fc;
  --green:#16a34a; --green-deep:#128a3e; --green-soft:#e7f6ec;
  --blue:#1266dc; --blue-soft:#eef5fe;
  --red:#e02b2b; --red-soft:#fdeaea; --red-line:#f5b9b9;
  --amber:#c2740b; --amber-soft:#fdf1de; --amber-line:#f0d4a4;
  --gold:#946c0d; --gold-soft:#f8f0d9;
  --violet:#5b4fe0; --violet-soft:#eeecfd;

  --ground:#f4f6f9; --surface:#ffffff; --surface-2:#f1f4f8; --surface-3:#f9fafc;
  --border:#e1e7ef; --border-2:#cfd8e3;
  --ink:#16233b; --ink-2:#4d5a72; --ink-3:#8793a6;
  --focus:#1266dc;

  --sh:0 1px 2px rgba(22,35,59,.06);
  --sh-md:0 4px 14px rgba(22,35,59,.10);
  --sh-lg:0 18px 44px rgba(15,25,45,.22);
  --r:8px; --r-lg:10px;
  --nav-h:58px;
  --sans:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:"Plus Jakarta Sans",var(--sans);
}
:root[data-theme="dark"]{
  --navy:#4f92f5; --navy-deep:#3d7fe0; --tint:#152444; --tint-2:#1b2f56;
  --green:#22c268; --green-deep:#1aa957; --green-soft:#16301f;
  --blue:#6ba3f7; --blue-soft:#152444; --red:#e8686d; --red-soft:#331b1e; --red-line:#5c2f33;
  --amber:#d9a44f; --amber-soft:#33280f; --amber-line:#5c4620; --gold:#d3ae5c; --gold-soft:#2e2713;
  --violet:#9b8ce0; --violet-soft:#231f3d;
  --ground:#0e1326; --surface:#151b33; --surface-2:#1c2340; --surface-3:#121830;
  --border:#28304d; --border-2:#333c5c;
  --ink:#e9ecf5; --ink-2:#a3abc2; --ink-3:#6f7794;
  --sh:0 1px 2px rgba(0,0,0,.35); --sh-md:0 6px 18px rgba(0,0,0,.4); --sh-lg:0 24px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
svg{flex:none}
.tnum{font-variant-numeric:tabular-nums}
.app{min-height:100%;display:flex;flex-direction:column}

/* top bar */
.topbar{height:var(--nav-h);background:var(--navy);color:#fff;display:flex;align-items:center;gap:6px;padding:0 16px;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em;padding-right:8px}
.brand .dot{width:22px;height:22px;border-radius:6px;background:#fff;display:grid;place-items:center}
.nav{display:flex;gap:2px}
.nav a{color:rgba(255,255,255,.68);text-decoration:none;font-weight:600;font-size:13px;padding:7px 12px;border-radius:8px;transition:.14s;cursor:pointer}
.nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav a.on{color:#fff;background:rgba(255,255,255,.12)}
.spring{flex:1}
.topctl{display:flex;align-items:center;gap:7px}
.fy{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:12px;padding:6px 10px;border-radius:8px}
.roleswitch{display:flex;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:2px}
.roleswitch button{border:0;background:transparent;color:rgba(255,255,255,.68);font-weight:600;font-size:11.5px;padding:5px 11px;border-radius:6px}
.roleswitch button.on{background:#fff;color:var(--navy)}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;display:grid;place-items:center;position:relative}
.iconbtn:hover{background:rgba(255,255,255,.14)}
.me{width:30px;height:30px;border-radius:50%;background:var(--green-deep);display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px}

.main{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:20px 22px 36px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{font-size:21px;font-weight:700}
.page-h .sub{color:var(--ink-2);font-size:13px;margin-top:2px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}

/* ---- status line (row 1) ---- */
.statusline{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.sbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 15px 13px;cursor:pointer;transition:.14s;position:relative;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.sbox::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border-2);transition:.14s}
.sbox:hover::before{background:var(--navy)}
.sbox:hover{border-color:var(--border-2);box-shadow:var(--sh-md);transform:translateY(-1px)}
.sbox .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sbox .lbl{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.sbox .dotm{width:7px;height:7px;border-radius:50%}
.sbox .n{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.sbox .hint2{font-size:11.5px;color:var(--ink-3)}
.sbox .go{color:var(--ink-3);opacity:0;transition:.14s}
.sbox:hover .go{opacity:1;color:var(--blue)}
.sbox .flagmini{font-size:11px;font-weight:700;color:var(--red);background:var(--red-soft);border-radius:5px;padding:1px 6px}

/* ---- widgets ---- */
.wgrid{display:grid;gap:16px;margin-bottom:16px}
.wgrid.two{grid-template-columns:1.55fr 1fr}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1.5px solid var(--border);background:var(--surface-3)}
.card-h h3{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.card-h .cnt{background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:11.5px;border-radius:20px;padding:1px 8px}
.card-h .cnt.hot{background:var(--red-soft);color:var(--red)}
.viewall{font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;background:none;border:0;padding:0}
.viewall:hover{text-decoration:underline}

.row{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.12s;position:relative}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-3)}
.row .rail{position:absolute;left:0;top:0;bottom:0;width:3px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:12.5px;flex:none}
.row .body{flex:1;min-width:0}
.row .t1{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.row .t2{color:var(--ink-2);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .right{display:flex;align-items:center;gap:9px;flex:none}
.row .meta{font-size:11.5px;color:var(--ink-3);text-align:right;white-space:nowrap}
.row .tmeta{display:flex;flex-direction:column;gap:2px;text-align:right;font-size:11px;color:var(--ink-3);white-space:nowrap}
.row .tmeta b{color:var(--ink-2);font-weight:700}
.row .meta b{display:block;color:var(--ink-2);font-weight:600}
.qa{border:1px solid var(--border-2);background:var(--surface);color:var(--ink-2);font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:7px;white-space:nowrap}
.qa:hover{border-color:var(--blue);color:var(--blue)}
.qa.solid{background:var(--navy);border-color:var(--navy);color:#fff}
.qa.solid:hover{background:var(--navy-deep)}

.prio{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:3px;white-space:nowrap;letter-spacing:.07em;text-transform:uppercase}
.prio.p1{background:var(--red-soft);color:var(--red)}
.prio.p2{background:var(--amber-soft);color:var(--amber)}
.prio.p3{background:var(--surface-2);color:var(--ink-3)}
.why{font-size:11px;color:var(--ink-3)}
.tierchip{font-size:9px;font-weight:800;letter-spacing:.07em;padding:2px 6px;border-radius:3px;text-transform:uppercase}
.tierchip.Elite{background:var(--gold-soft);color:var(--gold)}
.tierchip.Premium{background:var(--violet-soft);color:var(--violet)}
.tierchip.Advanced{background:var(--blue-soft);color:var(--blue)}
.tierchip.Basic{background:var(--surface-2);color:var(--ink-3)}
.stat-pill{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2.5px 8px;border-radius:3px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.stat-pill .d{width:6px;height:6px;border-radius:50%}
.sp-new{background:var(--blue-soft);color:var(--blue)} .sp-new .d{background:var(--blue)}
.sp-pend{background:var(--red-soft);color:var(--red)} .sp-pend .d{background:var(--red)}
.sp-open{background:var(--amber-soft);color:var(--amber)} .sp-open .d{background:var(--amber)}
.sp-closed{background:var(--green-soft);color:var(--green-deep)} .sp-closed .d{background:var(--green)}
.empty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:12.5px}
.ttype{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1.5px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-3)}
.ttype.MOM{background:var(--violet-soft);color:var(--violet)}
.ttype.Workings{background:var(--blue-soft);color:var(--blue)}
.row.sel{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--navy)}
.fromb{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);background:var(--blue-soft);border:1px solid var(--border);border-radius:8px;padding:6px 9px}
.fromb b{color:var(--ink)}
.clrf{margin-left:auto;border:0;background:transparent;color:var(--blue);font-weight:600;font-size:11px;padding:0}
.atbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
.atbl th{text-align:left;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.atbl td{padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.atbl tr:last-child td{border-bottom:0}
.atbl tbody tr{cursor:pointer}
.atbl tbody tr:hover td{background:var(--surface-3)}
.atbl td.bad{color:var(--red);font-weight:700}
.atbl td.good{color:var(--green-deep);font-weight:700}
.atbl td.sub2{color:var(--ink-2);white-space:normal}
.hflag{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:1px}
.hflag.r{background:var(--red)} .hflag.y{background:var(--amber)} .hflag.g{background:var(--green)}
.rchip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--red-soft);color:var(--red)}
.rchip.y{background:var(--amber-soft);color:var(--amber)}
.owntag{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1.5px 6px;border-radius:4px;background:var(--violet-soft);color:var(--violet);flex:none}
.owntag.pri{background:var(--surface-2);color:var(--ink-3)}
.miniav{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:10px;margin-right:7px;vertical-align:middle}
/* admin: task overview cards */
.sech{font-family:var(--display);font-weight:800;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);margin:6px 0 12px;display:flex;align-items:center;gap:8px}
.sech::before{content:"";width:3px;height:14px;background:var(--navy);border-radius:2px}
.tov{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:26px}
.tcard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px;text-align:left;transition:.14s;font:inherit;color:inherit;width:100%}
.tcard[data-goto]{cursor:pointer}
.tcard:hover{border-color:var(--border-2);box-shadow:var(--sh-md)}
.tcard .ic{width:44px;height:44px;border-radius:12px;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;flex:none}
.tcard .tb{flex:1;min-width:0;display:block}
.tcard .tt{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.35}
.tcard .tn{display:block;margin-top:4px}
.tcard .tn b{font-family:var(--display);font-size:25px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.tcard .tn span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.tcard .split{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.tcard .split span{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink-2)}
.tcard .split .d{width:6px;height:6px;border-radius:50%;flex:none}
.tcard .split .d.rp{background:var(--red)} .tcard .split .d.cl{background:var(--amber)}
.tcard .go2{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border-2);color:var(--ink-3);display:grid;place-items:center;flex:none;transition:.14s}
.tcard[data-goto] .go2{border-color:var(--navy);color:var(--navy)}
.tcard:hover .go2{background:var(--navy);border-color:var(--navy);color:#fff}
.tcard .go2.hot{border-color:var(--red);color:var(--red)}
.tcard:hover .go2.hot{background:var(--red);border-color:var(--red)}
/* admin: existing agent grid — matches current product */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:16px}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 15px;position:relative;cursor:pointer;transition:.14s}
.acard:hover{box-shadow:var(--sh-md)}
.acard.flag{border:1.5px solid var(--red)}
.abadge{position:absolute;top:-9px;right:-6px;background:var(--red);color:#fff;border-radius:50%;min-width:22px;height:22px;display:grid;place-items:center;font-size:10.5px;font-weight:800;border:2px solid var(--surface)}
.ahd{display:flex;align-items:flex-start;gap:11px}
.apic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.ard{flex:1;min-width:0}
.anm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.met{background:var(--surface-2);border-radius:7px;padding:5px 6px;text-align:center}
.met .k{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.met .v{font-weight:700;font-size:15px;margin-top:1px}
.met .v.bad{color:var(--red)}
.aft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;padding-top:11px;border-top:1px solid var(--border)}
.aft .lk{font-size:12.5px;font-weight:500;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
.aft .lk:hover{color:var(--blue)}
@media (max-width:1100px){.tov{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.tov{grid-template-columns:1fr}}
.note-p2{margin-top:16px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--border-2);border-radius:9px;padding:10px 13px}

/* profile widget */
.pcard{padding:16px}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pmetrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pm{background:var(--surface-2);border-radius:9px;padding:9px 11px}
.pm.act{border:1px solid transparent;cursor:pointer;text-align:left;font:inherit;transition:.14s}
.pm.act:hover{border-color:var(--border-2);background:var(--surface)}
.mtime{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);width:42px;flex:none}
.mtime.past{color:var(--ink-3);font-weight:600}
.pm .k{font-size:11px;color:var(--ink-3);font-weight:600}
.pm .v{font-family:var(--display);font-weight:700;font-size:17px;margin-top:1px}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%}

/* ---- chat 3 pane ---- */
.inbox{display:grid;grid-template-columns:312px 1fr 300px;height:calc(100vh - var(--nav-h) - 42px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh)}
.col{display:flex;flex-direction:column;min-height:0}
.col.list{border-right:1px solid var(--border);background:var(--surface-3)}
.col.ctx{border-left:1px solid var(--border);background:var(--surface-3)}
.lh{padding:12px 13px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.lh .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lcount{font-size:11.5px;font-weight:700;color:var(--ink-3);background:var(--surface-2);border-radius:20px;padding:1px 8px}
.searchrow{display:flex;align-items:center;gap:7px}
.searchrow .search{flex:1;min-width:0}
.ownsel{flex:none;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:7px 6px;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink-2);outline:none;max-width:112px}
.ownsel:focus{border-color:var(--focus)}
.lh .t h3{font-size:14px;font-weight:700}
.search{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.search input{border:0;background:transparent;outline:none;font:inherit;font-size:12.5px;color:var(--ink);width:100%}
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--border);margin:0 -13px;padding:0 13px}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink-3);font-weight:700;font-size:11.5px;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;letter-spacing:.01em;min-width:0}
.tabs button .l{white-space:nowrap}
.tabs button:hover{color:var(--ink-2)}
.tabs button.on{color:var(--navy)}
.tabs button.on::after{content:"";position:absolute;left:4px;right:4px;bottom:-1.5px;height:2.5px;background:var(--navy);border-radius:2px}
.tabs button .b{font-size:12.5px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.2}
.tabs button.on .b{color:var(--navy)}
.tabsub{font-size:11px;font-weight:600;color:var(--ink-3);padding-top:9px}
.subfilter{display:flex;gap:6px}
.chipf{border:1px solid var(--border-2);background:var(--surface);color:var(--ink-2);font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px}
.chipf.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chipf.zero{opacity:.45}
.grouphdr{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:10px 14px 6px;background:var(--surface-3);position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:7px}
.clist{overflow-y:auto;flex:1}
.crow{display:flex;gap:10px;padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;position:relative;transition:.12s}
.crow:hover{background:var(--surface-3)}

/* ---------- status model ---------- */
const lastW=c=>{const m=[...c.msgs].reverse().find(x=>x.w!=='sys');return m?m.w:'them';};
const everReplied=c=>c.msgs.some(m=>m.w==='me');
const HOLD=/^((ok|okay|sure|noted|thanks|thank you|will check|will revert|will do|will get back|checking|looking into it|got it|sure thing|yes|yeah|fine|great|k)\s*)+$/i;
function isHolding(c){const m=[...c.msgs].reverse().find(x=>x.w==='me');if(!m)return false;const t=m.t.toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();return HOLD.test(t);}
/* NEW = client wrote last (inbound needing attention — replied-to or not)
   FOLLOWUP = I'm flagged for action / sent a holding reply — action is on me
   CLOSURE  = I answered, nothing flagged — waiting to be closed */
function statusOf(c){
  if(c.closed)return 'CLOSED';
  if(lastW(c)==='them')return c.reopened?'CLOSURE':'NEW';  /* reopened = existing session, not new */
  if(c.remind||isHolding(c))return 'FOLLOWUP';
  return 'CLOSURE';
}
const needsMyAction=c=>statusOf(c)==='FOLLOWUP';
const openTasks=c=>c.tasks.filter(t=>t.status==='OPEN');
const blocked=c=>openTasks(c).length>0;
const resLeft=c=>RES_SLA-c.openedHrs;               /* 48h for every chat */
const respLeft=c=>FR_SLA-c.hrs;                     /* 12 business hours  */
const sinceAction=c=>c.sinceAction!=null?c.sinceAction:c.hrs;
const ownOf=c=>c.own||'primary';                    /* primary | secondary owner */

/* priority: 1 At Risk (red) · 2 Less Risky (yellow) · 3 Later (none) */
/* An agent is highlighted at risk when they hold any At-Risk chat.
   A chat is At Risk on either hard condition — no score involved:
     1. Chat not closed  → past its close target
     2. Response not sent → zero agent reply, past the reply target        */
const noResponseSent=c=>!c.msgs.some(m=>m.w==='me')&&c.hrs>FR_SLA;
const notClosedInTime=c=>resLeft(c)<=0;
function prio(c){
  if(c.closed)return {p:3,label:'Later',why:'Closed',score:0};
  if(notClosedInTime(c))return {p:1,label:'At Risk',why:'Past close target',score:9999};
  if(noResponseSent(c))return {p:1,label:'At Risk',why:'No response sent',score:9999};
  /* Only three inputs: aging, recent action, approaching SLA. */
  const aging=c.openedHrs;                 /* chat created -> now      */
  const idle=sinceAction(c);               /* last action  -> now      */
  const answered=everReplied(c);
  const used=answered?aging/RES_SLA:c.hrs/FR_SLA;          /* SLA consumed */
  const sla=used<.5?1:used<.75?1.5:used<.9?2.5:4;          /* approaching SLA */
  const score=Math.round((aging+2*idle)*sla);
  let p=3,label='Later';
  if(score>=150){p=1;label='At Risk';} else if(score>=60){p=2;label='Less Risky';}
  const why = used>=.9 ? (answered?'Close SLA nearly breached':'Response SLA nearly breached')
            : idle>=24 ? 'No action in '+ago(idle)
            : aging>=24 ? 'Open '+ago(aging)
            : 'Open '+ago(aging);
  return {p,label,why,score,aging,idle,sla,used};
}
const pcol=p=>p===1?'var(--red)':p===2?'var(--amber)':'transparent';
const ago=h=>h<1?Math.round(h*60)+'m':h<48?Math.round(h)+'h':Math.round(h/24)+'d';
const left=h=>h<=0?'overdue':h<1?Math.round(h*60)+'m':h<48?Math.round(h)+'h':Math.round(h/24)+'d';
const prev=c=>{const m=[...c.msgs].reverse().find(x=>x.w!=='sys');return m?(m.w==='me'?'You: ':'')+(m.f?'📎 '+m.f:m.t):'—';};

const TABL={ALL:'All chats',NEW:'New chats',FOLLOWUP:'Action pending',CLOSURE:'Open sessions'};

function agentStats(id){
  const a=AGENTS.find(x=>x.id===id);
  const cs=CHATS.filter(c=>c.advisorId===id&&!c.closed);
  const atRisk=cs.filter(c=>prio(c).p===1).length;         /* chat not closed in time, or no response sent */
  const risky=cs.filter(c=>prio(c).p===2).length;
  const noResp=cs.filter(noResponseSent).length;            /* condition 2 */
  const notClosed=cs.filter(notClosedInTime).length;        /* condition 1 */
  const unatt=cs.filter(c=>!c.msgs.some(m=>m.w==='me')).length;
  const nw=cs.filter(c=>statusOf(c)==='NEW').length;
  const fu=cs.filter(c=>statusOf(c)==='FOLLOWUP').length;
  const cp=cs.filter(c=>statusOf(c)==='CLOSURE').length;
  const oldest=cs.length?Math.max.apply(null,cs.map(c=>c.hrs)):0;
  const reasons=[];
  if(atRisk)reasons.push([atRisk+' at risk','r']);
  if(unatt)reasons.push([unatt+' unanswered','r']);
  if(cs.length>=8)reasons.push([cs.length+' open items','r']);
  else if(cs.length>=6)reasons.push([cs.length+' open items','y']);
  if(!atRisk&&risky)reasons.push([risky+' less risky','y']);
  const flag=(atRisk||unatt||cs.length>=8)?'r':(risky||cs.length>=6)?'y':'g';
  return {a,open:cs.length,atRisk,risky,noResp,notClosed,unatt,nw,fu,cp,oldest,flag,reasons,chats:cs};
}

/* everything the active tab + search allow, before the ownership facet */
function listBase(){
  let l=S.tab==='ALL'?scope().slice()
       :S.tab==='RISK'?scope().filter(c=>!c.closed&&prio(c).p<=2)
       :S.tab==='UNANS'?scope().filter(c=>!c.closed&&!c.msgs.some(m=>m.w==='me'))
       :scope().filter(c=>statusOf(c)===S.tab);
  if(S.q){const q=S.q.toLowerCase();l=l.filter(c=>c.client.toLowerCase().includes(q)||c.category.toLowerCase().includes(q));}
  return l;
}
function listFor(){
  let l=listBase();
  if(S.own!=='all')l=l.filter(c=>ownOf(c)===S.own);
  return l.map(c=>({c,p:prio(c)})).sort((a,b)=>a.p.p-b.p.p||b.p.score-a.p.score);
}
function chat(){

/* ================= actions ================= */
const cur=()=>CHATS.find(c=>c.id===S.active);
function toast(m,k,i){const t=document.createElement('div');t.className='toast '+(k||'');t.innerHTML=(i||'')+`<span>${m}</span>`;document.getElementById('toasts').appendChild(t);setTimeout(()=>{t.style.transition='.3s';t.style.opacity=0;setTimeout(()=>t.remove(),300);},3400);}
const now=()=>'4 Sep, '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
const bot=()=>{const t=document.getElementById('th');if(t)t.scrollTop=t.scrollHeight;};
function send(){
  const ta=document.getElementById('cmp'),c=cur();if(!ta||!c)return;const v=ta.value.trim();if(!v)return;
  const rm=document.getElementById('rm')?.checked;
  c.msgs.push({w:'me',t:v,tm:now()});
  if(rm)c.remind=true;
  DAY.replies++;
  render();bot();
  const st=statusOf(c);
  if(st==='FOLLOWUP')toast(isHolding(c)?'Sent — but that reads as a holding reply. Still on you.':'Sent · kept in Action pending','warn',I.bell2);
  else toast('Sent · moved to Closure pending — close it when done','info',I.check);
}
function modal(h){let s=document.getElementById('scrim');if(!s){s=document.createElement('div');s.id='scrim';s.className='scrim';document.body.appendChild(s);}s.innerHTML=`<div class="modal">${h}</div>`;s.onclick=e=>{if(e.target===s)close();};binds(s);}
function close(){const s=document.getElementById('scrim');if(s)s.remove();}
window.closeM=close;

   <div class="mb"><div class="warn red"><div class="wh">${I.lock} ${openTasks(c).length} open task(s)</div><ul>${openTasks(c).map(t=>`<li>${I.check} ${t.title}</li>`).join('')}</ul></div></div>
   <div class="mf"><button class="btn pri" onclick="closeM()">Got it</button></div>`);return;}
  modal(`<div class="mh"><div><h3>Close this Session?</h3></div><button class="x" onclick="closeM()">${I.x}</button></div>
  <div class="mb">
   <div class="f"><textarea id="mom" maxlength="500" placeholder="Enter MOM" class="ta-lg"></textarea><div class="cc"><span id="momc">0</span>/500</div></div>
   <div class="f"><textarea id="fb" maxlength="500" placeholder="Enter Feedback" class="ta-lg"></textarea><div class="cc"><span id="fbc">0</span>/500</div></div>
   <button class="btn pri wide" id="cs" data-act="doclose" data-c="${c.id}" disabled>Close Session</button>
  </div>`);
  const mom=document.getElementById('mom'), fb=document.getElementById('fb'), btn=document.getElementById('cs');
  const sync=()=>{document.getElementById('momc').textContent=mom.value.length;
                  document.getElementById('fbc').textContent=fb.value.length;
                  btn.disabled=mom.value.trim().length===0;};
  mom.oninput=sync; fb.oninput=sync; mom.focus();
}

function seg(id){const e=document.getElementById(id);if(!e)return;e.querySelectorAll('.sb').forEach(b=>b.onclick=()=>{e.querySelectorAll('.sb').forEach(x=>x.classList.remove('on'));b.classList.add('on');});}
function doClose(c){
  const hold=isHolding(c);
  const mom=(document.getElementById('mom')||{}).value||'';
  const fb=(document.getElementById('fb')||{}).value||'';
  c.closed=true;c.remind=false;c.disp={mom:mom.trim(),feedback:fb.trim()};DAY.closed++;
  c.msgs.push({w:'sys',t:'Session closed',tm:now()});
  close();render();
  /* audit no longer depends on a disposition category — the holding reply alone triggers it */
  if(hold)toast('Closed — flagged for review (holding reply)','warn',I.alert);
  else toast('Session closed','good',I.check);
}

function binds(root){root.querySelectorAll('[data-act]').forEach(el=>{const a=el.dataset.act;
 if(a==='send')el.onclick=send;
 else if(a==='task')el.onclick=()=>taskModal(cur());
 else if(a==='doc')el.onclick=()=>docModal(cur());
 else if(a==='close')el.onclick=()=>closeModal(cur());
 else if(a==='simreply')el.onclick=()=>{const c=cur();
   c.closed=false;c.reopened=true;c.remind=false;c.hrs=0;c.sinceAction=0;c.openedHrs=Math.min(c.openedHrs,4);
   c.msgs.push({w:'them',t:'One more thing before we wrap up — can you confirm the final number?',tm:now()});
   S.tab='CLOSURE';render();bot();toast('Chat reopened — now in Open session','info',I.reply);}
 else if(a==='clearremind')el.onclick=()=>{const c=cur();c.remind=false;if(isHolding(c))c.msgs.push({w:'sys',t:'Marked as not requiring further action',tm:now()});DAY.cleared++;render();toast('Moved to Closure pending — close it when done','info',I.check);};
 else if(a==='savet')el.onclick=()=>{const c=CHATS.find(x=>x.id===el.dataset.c),t=document.getElementById('tt').value.trim();if(!t){document.getElementById('tt').style.borderColor='var(--red)';return;}
   c.tasks.push({id:'t'+Date.now(),title:t,owner:'You',ownerId:'me',status:'OPEN',due:fd(document.getElementById('td').value),pri:document.querySelector('#tp .sb.on')?.dataset.v||'Medium'});close();render();toast('Task added · closure now blocked','',I.lock);}
 else if(a==='saved')el.onclick=()=>{const c=CHATS.find(x=>x.id===el.dataset.c),n=document.getElementById('dn').value.trim();if(!n){document.getElementById('dn').style.borderColor='var(--red)';return;}
   const nt=document.getElementById('dnote').value.trim();c.docs.push({n,s:'REQUESTED'});c.msgs.push({w:'me',t:`Requested: ${n}${nt?' — '+nt:''}`,tm:now()});close();render();bot();toast('Requested · moved to Open','info',I.doc);}
 else if(a==='doclose')el.onclick=()=>doClose(CHATS.find(x=>x.id===el.dataset.c));
});}
const fd=d=>{if(!d)return '—';const x=new Date(d+'T00:00');return isNaN(x)?d:x.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});};
function theme(){const r=document.documentElement,n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('pth',n)}catch(e){}}
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('pth')||'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}

function wire(){
 document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>{S.view=e.dataset.nav;render();});
 document.querySelectorAll('[data-role]').forEach(e=>e.onclick=()=>{S.role=e.dataset.role;S.view=S.role==='admin'?'adash':'dash';S.agent=null;S.from='';render();});
 document.querySelectorAll('[data-agent]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();S.agent=e.dataset.agent;S.view='agent';render();});
 document.querySelectorAll('[data-adminhome]').forEach(e=>e.onclick=()=>{S.view='adash';S.agent=null;render();});
 const t=document.querySelector('[data-act="theme"]');if(t)t.onclick=theme;
 const LBL={FOLLOWUP:'Action pending',NEW:'New chats',CLOSURE:'Open session',ALL:'All chats',RISK:'At risk',UNANS:'Unanswered chats'};
 document.querySelectorAll('[data-allagents]').forEach(e=>e.onclick=()=>{S.view='agents';S.agent=null;render();});
 document.querySelectorAll('[data-goto]').forEach(e=>e.onclick=()=>{S.view='chat';S.tab=e.dataset.goto;S.from=LBL[e.dataset.goto]||'';S.q='';render();});
 document.querySelectorAll('[data-tasks]').forEach(e=>e.onclick=()=>{S.view='tasks';S.taskType='all';render();});
 document.querySelectorAll('[data-task]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();S.activeTask=e.dataset.task;S.view='tasks';render();});
 document.querySelectorAll('[data-ttype]').forEach(e=>e.onclick=()=>{S.taskType=e.dataset.ttype;S.activeTask=null;render();});
 document.querySelectorAll('[data-clearfrom]').forEach(e=>e.onclick=()=>{S.from='';render();});
 document.querySelectorAll('[data-join]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const m=MEETINGS.find(x=>x.id===e.dataset.join);toast(`Joining ${m.client} — ${m.type}`,'info',I.video);});
 document.querySelectorAll('[data-mom]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const m=MEETINGS.find(x=>x.id===e.dataset.mom);const c=CHATS.find(x=>x.id===m.chat);
   if(!c.tasks.some(t=>t.type==='MOM'&&t.status==='OPEN'))c.tasks.push({id:'t'+Date.now(),type:'MOM',title:`File MOM — ${m.type}`,owner:'You',ownerId:'me',status:'OPEN',due:'4 Sep 2026',pri:'Medium'});
   m.mom=true;render();toast('MOM task created — find it under Tasks','',I.check);});
 document.querySelectorAll('[data-open]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const c=CHATS.find(x=>x.id===e.dataset.open);S.active=c.id;S.view='chat';S.tab=statusOf(c);S.from='';render();});
 document.querySelectorAll('[data-chat]').forEach(e=>e.onclick=()=>{S.active=e.dataset.chat;render();bot();});
 document.querySelectorAll('[data-profile]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const c=CHATS.find(x=>x.id===e.dataset.profile);toast(`Opening ${c.client}'s profile`,'info',I.ext);});
 document.querySelectorAll('[data-own]').forEach(e=>e.onclick=()=>{S.own=e.dataset.own;render();});
 const osel=document.getElementById('ownsel');if(osel)osel.onchange=e=>{S.own=e.target.value;render();};
 document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{S.tab=e.dataset.tab;S.from='';render();});
 document.querySelectorAll('[data-tt]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const[ci,ti]=e.dataset.tt.split(':');const c=CHATS.find(x=>x.id===ci),k=c.tasks.find(x=>x.id===ti);k.status=k.status==='OPEN'?'DONE':'OPEN';render();toast(k.status==='DONE'?'Task done':'Task reopened','',I.check);});
 const q=document.getElementById('q');if(q)q.oninput=e=>{S.q=e.target.value;const p=q.selectionStart;render();const n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(p,p);}};
 const cm=document.getElementById('cmp');if(cm){const g=()=>{cm.style.height='auto';cm.style.height=Math.min(cm.scrollHeight,110)+'px';};cm.addEventListener('input',g);g();cm.onkeydown=ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();send();}};bot();}
 const rm=document.getElementById('rm');if(rm)rm.onchange=()=>document.getElementById('rmL').classList.toggle('on',rm.checked);
 binds(document);
}
render();
</script>
